<body>
<main class="page">
  <nav class="site-nav" data-page="log"></nav>
  <div class="head">
    <h1>練琴紀錄</h1>
    <div class="year">
      <wa-button appearance="plain" size="small" id="prev-year"><wa-icon name="chevron-left" label="前一年"></wa-icon></wa-button>
      <b id="year"></b>
      <wa-button appearance="plain" size="small" id="next-year"><wa-icon name="chevron-right" label="下一年"></wa-icon></wa-button>
    </div>
  </div>

  <wa-radio-group id="group" orientation="horizontal" size="small" value="all">
    <wa-radio appearance="button" value="all">全部</wa-radio><wa-radio appearance="button" value="play">練琴</wa-radio><wa-radio appearance="button" value="drill">基本功</wa-radio>
  </wa-radio-group>
  <div class="tiles" id="tiles"></div>

  <section class="card box">
    <div class="box-head">
      <h2>每天練了多久</h2>
      <span class="muted" style="font-size:14px">點一天看練了什麼</span>
    </div>
    <div class="hm-wrap" id="hm-wrap"><div class="skel"><i></i><i></i><i></i></div></div>
    <div class="hm-legend">
      <span><i style="background:var(--hm-0)"></i>沒練</span>
      <span><i style="background:var(--hm-1)"></i>15 分鐘內</span>
      <span><i style="background:var(--hm-2)"></i>15–30 分</span>
      <span><i style="background:var(--hm-3)"></i>30–60 分</span>
      <span><i style="background:var(--hm-4)"></i>1 小時以上</span>
      <span id="goal-legend"><i class="goal-ring"></i>外框：達成當天的每日目標</span>
    </div>
  </section>

  <section class="card box" id="day-box">
    <div class="box-head"><h2 id="day-title"></h2><span class="muted" id="day-total"></span></div>
    <div class="day-items" id="day-items"></div>
  </section>

  <section class="card box">
    <div class="box-head"><h2>每個月</h2><span class="muted" style="font-size:14px">點一個月看練了什麼</span></div>
    <div class="months">
      <div class="mrow mhead"><span>月份</span><span></span><span class="v">時間</span><span class="v">天數</span></div>
      <div id="months"><div class="skel"><i></i><i></i><i></i></div></div>
    </div>
  </section>
</main>
</body>
