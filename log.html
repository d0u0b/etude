<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4dd">
<title>練琴紀錄 · Étude</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>(function(d){var t='cotton';try{t=localStorage.getItem('ppt.theme')||t}catch(e){}d.dataset.theme=t;if(t==='night')d.classList.add('wa-dark');var m=document.querySelector('meta[name=theme-color]');if(m&&t==='night')m.content='#2b2421'})(document.documentElement)</script>
<style>.head{align-items:center;gap:8px;margin:4px 0 18px;display:flex}.head h1{letter-spacing:.02em;flex:1;margin:0;font-size:28px;font-weight:600}.year{font-variant-numeric:tabular-nums;align-items:center;gap:2px;font-size:18px;display:flex}.year b{text-align:center;min-width:3.2em;font-weight:500}.tiles{grid-template-columns:repeat(4,1fr);gap:12px;display:grid}@media (width<=600px){.tiles{grid-template-columns:1fr 1fr}}.tile{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:12px 16px;font-size:13px}.tile b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;line-height:1.35;display:block}.tile b small{margin:0 2px;font-size:13px;font-weight:500}.box{margin-top:14px;padding:18px 20px}.box-head{flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px;display:flex}.box-head h2{flex:1;margin:0;font-size:16px;font-weight:600}.months{flex-direction:column;gap:2px;display:flex}.mrow{font-variant-numeric:tabular-nums;grid-template-columns:3.2em 1fr 7.5em 3.5em;align-items:center;gap:14px;padding:7px 0;font-size:14px;display:grid}#months .mrow+.mrow{border-top:1px solid var(--line)}.mhead{color:var(--muted);border-bottom:1px solid var(--line);padding:0 0 6px;font-size:12px}.mrow .v b{color:var(--ink);font-weight:500}.mrow.now span:first-child{font-weight:600}#months .mrow{cursor:pointer;border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}#months .mrow:active,#months .mrow.sel{background:var(--accent-soft)}.mrow .bar-track{border-radius:4px;height:8px}.mrow .bar-track i{border-radius:4px}.mrow .v{color:var(--muted);text-align:right;white-space:nowrap}@media (width<=480px){.mrow{grid-template-columns:2.8em 1fr 6.6em 2.8em;gap:8px;font-size:13px}}.day-items{flex-direction:column;display:flex}.item{color:inherit;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;display:grid}.item+.item{border-top:1px solid var(--line)}.item .t{font-size:16px;font-weight:500}.item .d{color:var(--muted);grid-column:1/-1;font-size:13px}.item .ms{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}.item wa-icon{color:var(--muted);vertical-align:-2px;margin-right:4px;font-size:14px}</style>
  <script type="module" crossorigin src="./assets/log-DRuibiVS.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-4BBQHXWn.js">
  <link rel="modulepreload" crossorigin href="./assets/stats-CLo0mvxX.js">
  <link rel="modulepreload" crossorigin href="./assets/charts-Gm_WNYtc.js">
  <link rel="stylesheet" crossorigin href="./assets/common-DK2Lsw1G.css">
</head>
<body>
<main class="page">
  <nav class="site-nav" data-page="log"></nav>
  <div class="head">
    <h1>練琴紀錄</h1>
    <div class="year">
      <wa-button appearance="plain" size="small" id="prev-year"><wa-icon name="chevron-left" label="前一年"></wa-icon></wa-button>
      <b id="year"></b>
      <wa-button appearance="plain" size="small" id="next-year"><wa-icon name="chevron-right" label="下一年"></wa-icon></wa-button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <section class="card box">
    <div class="box-head">
      <h2>每天練了多久</h2>
      <span class="muted" style="font-size:13px">點一天看練了什麼</span>
    </div>
    <div class="hm-wrap" id="hm-wrap"></div>
    <div class="hm-legend">
      <span><i style="background:var(--hm-0)"></i>沒練</span>
      <span><i style="background:var(--hm-1)"></i>15 分鐘內</span>
      <span><i style="background:var(--hm-2)"></i>15–30 分</span>
      <span><i style="background:var(--hm-3)"></i>30–60 分</span>
      <span><i style="background:var(--hm-4)"></i>1 小時以上</span>
      <span id="goal-legend"><i class="goal-ring"></i>外框：達成當天的每日目標</span>
    </div>
  </section>

  <section class="card box" id="day-box">
    <div class="box-head"><h2 id="day-title"></h2><span class="muted" id="day-total"></span></div>
    <div class="day-items" id="day-items"></div>
  </section>

  <section class="card box">
    <div class="box-head"><h2>每個月</h2><span class="muted" style="font-size:13px">點一個月看練了什麼</span></div>
    <div class="months">
      <div class="mrow mhead"><span>月份</span><span></span><span class="v">練琴時間</span><span class="v">天數</span></div>
      <div id="months"></div>
    </div>
  </section>
</main>
</body>
</html>
