<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Étude</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>(function(d){var t='cotton';try{t=localStorage.getItem('ppt.theme')||t}catch(e){}d.dataset.theme=t;if(t==='night')d.classList.add('wa-dark');var m=document.querySelector('meta[name=theme-color]');if(m&&t==='night')m.content='#2b2421'})(document.documentElement)</script>
<style>.top{align-items:center;gap:10px;padding-top:6px;display:flex}.top .date{color:var(--muted);letter-spacing:.04em;flex:1;font-size:15px}h1.app{letter-spacing:.02em;margin:6px 0 0;font-size:30px;font-weight:600}.greet{margin:12px 0 0;font-size:19px}.cheer{color:var(--muted);min-height:1.6em;margin:2px 0 0;font-size:14px}.modes{grid-template-columns:repeat(3,1fr);gap:12px;display:grid}.mode{background:var(--surface);border:1px solid var(--line);color:var(--ink);-webkit-backdrop-filter:blur(8px);border-radius:18px;flex-direction:column;gap:4px;min-height:132px;padding:18px 18px 16px;display:flex}.mode:active{background:var(--accent-soft)}.mode wa-icon{color:var(--accent);margin-bottom:8px;font-size:24px}.mode .t{font-size:18px;font-weight:600}.mode .d{color:var(--muted);font-size:13px;line-height:1.55}@media (width<=560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px}.mode wa-icon{flex:none;margin:0}}.score{font-variant-numeric:tabular-nums;font-size:20px}.score small{color:var(--muted);font-size:12px;display:block}.small{font-size:14px}.week{grid-template-columns:1fr minmax(220px,300px);align-items:end;gap:24px;margin-top:22px;padding:20px 22px;display:grid}.facts{border-top:1px solid var(--line);flex-wrap:wrap;gap:24px;margin-top:16px;padding-top:14px;display:flex}.facts div{color:var(--muted);font-size:13px}.facts b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:20px;font-weight:500;display:block}.facts .up{color:var(--c-ok);margin-left:4px;font-size:13px;font-weight:400}.facts .down{color:var(--c-bad);margin-left:4px;font-size:13px;font-weight:400}.today-goal{border-bottom:1px solid var(--line);flex-direction:column;grid-column:1/-1;gap:6px;padding-bottom:14px;display:flex}.today-goal .row{gap:8px;font-size:15px}.today-goal b{font-variant-numeric:tabular-nums;font-weight:600}.today-goal .done{color:var(--c-ok)}.today-goal .bar-track{border-radius:4px;height:8px}.today-goal .bar-track i{border-radius:4px;transition:width .4s}.goal-pop{flex-direction:column;gap:10px;max-width:340px;display:flex}.goal-pop b{font-weight:600}.goal-pop p{margin:0;line-height:1.6}.week-more{grid-column:1/-1;justify-self:end;margin-top:-6px;font-size:14px}.week .empty-hint{color:var(--muted);margin-top:14px;font-size:14px;line-height:1.7}@media (width<=600px){.week{grid-template-columns:1fr}}.tip{gap:12px;margin-top:18px}.tip wa-icon{color:var(--accent);flex:none;font-size:22px}.tip b{font-weight:500}footer{color:var(--muted);margin-top:36px;font-size:13px;line-height:1.7}</style>
  <script type="module" crossorigin src="./assets/index-CuI5gezk.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-DfGH9JAR.js">
  <link rel="modulepreload" crossorigin href="./assets/stats-Db0Dhrk0.js">
  <link rel="modulepreload" crossorigin href="./assets/charts-B7Q2jbNP.js">
  <link rel="modulepreload" crossorigin href="./assets/backup-BLsUypHt.js">
  <link rel="stylesheet" crossorigin href="./assets/common-XVbAMElX.css">
</head>
<body>
<main class="page">
  <nav class="site-nav" data-page="home"></nav>
  <div class="top">
    <span class="date" id="date"></span>
    <button class="pill" id="midi-pill"><span class="dot"></span>連接 MIDI</button>
  </div>
  <h1 class="app">Étude</h1>
  <p class="greet" id="greet">今天也來練一下琴～</p>
  <p class="cheer" id="cheer"></p>
  <div id="backup-tip" class="card pad row tip" hidden>
    <wa-icon name="history"></wa-icon>
    <div class="grow"><b id="tip-title"></b><div class="muted small">樂譜和紀錄只存在這台平板，備份一份比較安心。</div></div>
    <wa-button size="small" appearance="plain" id="tip-later">稍後</wa-button>
    <wa-button size="small" variant="brand" id="tip-backup">備份</wa-button>
  </div>

  <section class="card pad week" id="week">
    <div class="today-goal" id="today">
      <div class="row">
        <span class="grow" id="today-text"></span>
        <wa-button size="small" appearance="plain" id="goal-btn"><wa-icon slot="start" name="target"></wa-icon><span id="goal-label"></span></wa-button>
      </div>
      <div class="bar-track" id="today-track"><i id="today-bar"></i></div>
    </div>
    <div>
      <div class="muted small row" style="gap:0"><span class="grow">本週練琴</span></div>
      <div class="big-num" id="w-total"></div>
      <div class="muted small" id="w-cmp"></div>
      <div class="facts" id="w-facts"></div>
    </div>
    <div id="w-bars"></div>
    <a class="week-more" href="log.html" id="to-log">看每天、每月的紀錄 ›</a>
  </section>
  <wa-popover for="goal-btn" id="goal-pop" placement="bottom-end">
    <div class="goal-pop">
      <b>每天練琴目標</b>
      <wa-radio-group id="goal" orientation="horizontal" size="small"></wa-radio-group>
      <p class="muted small">練琴時間包含練習模式和看 PDF 彈奏。達到目標的日子，在練琴紀錄的熱力圖會加上外框；改目標不會影響以前的日子。</p>
    </div>
  </wa-popover>


  <div class="label">模式</div>
  <nav class="modes">
    <a class="mode" href="play.html"><wa-icon name="book-open"></wa-icon><div><div class="t">彈奏</div><div class="d">看 PDF 樂譜，踏板翻頁</div></div></a>
    <a class="mode" href="practice.html"><wa-icon name="music"></wa-icon><div><div class="t">練習曲</div><div class="d">彈課本練習題，判斷音高和節奏</div></div></a>
    <a class="mode" href="drill.html"><wa-icon name="target"></wa-icon><div><div class="t">基本功</div><div class="d">視譜、音階和弦、節奏</div></div></a>
  </nav>


  <footer>Étude ・ 給自己練琴用</footer>
</main>

</body>
</html>
