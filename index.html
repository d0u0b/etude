<body>
<main class="page">
  <nav class="site-nav" data-page="home"></nav>
  <div class="top">
    <span class="date" id="date"></span>
    <button class="pill" id="midi-pill"><span class="dot"></span>連接 MIDI</button>
  </div>
  <h1 class="greet" id="greet">今天也來練一下琴～</h1>
  <p class="cheer" id="cheer"></p>
  <div id="backup-tip" class="card pad row tip" hidden>
    <wa-icon name="history"></wa-icon>
    <div class="grow"><b id="tip-title"></b><div class="muted small">樂譜和紀錄只存在這台裝置，備份一份比較安心。</div></div>
    <wa-button size="small" appearance="plain" id="tip-later">稍後</wa-button>
    <wa-button size="small" variant="brand" id="tip-backup">備份</wa-button>
  </div>

  <section class="card today-card" id="today">
    <div class="gring" id="g-ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle class="trk" cx="48" cy="48" r="42"/><circle class="val" id="g-val" cx="48" cy="48" r="42" stroke-dasharray="0 264"/></svg><div class="in"><b id="g-num">0</b><small id="g-of"></small></div></div>
    <div class="grow"><div class="k">今天・<button class="goal-btn" id="goal-btn"><span id="goal-label"></span><wa-icon name="chevron-down"></wa-icon></button></div><div class="v" id="today-text"></div><div class="s" id="today-sub"></div></div>
  </section>
  <wa-popover for="goal-btn" id="goal-pop" placement="bottom-end">
    <div class="goal-pop">
      <b>每天練琴目標</b>
      <wa-radio-group id="goal" orientation="horizontal" size="small"></wa-radio-group>
      <p class="muted small">練琴時間包含練習模式和看 PDF 彈奏。達到目標的日子，在練琴紀錄的熱力圖會加上外框；改目標不會影響以前的日子。</p>
    </div>
  </wa-popover>

  <div class="home-label">快速開始</div>
  <nav class="tiles" id="tiles">
    <a class="c1" href="drill.html"><wa-icon name="target"></wa-icon>每日基本功<small id="q-daily"></small></a>
    <a class="c2" href="metronome.html"><wa-icon name="metronome"></wa-icon>節拍器<small id="q-metro"></small></a>
    <a class="c3" href="classes.html"><wa-icon name="chalkboard"></wa-icon>上課紀錄<small id="q-class"></small></a>
    <a class="c4" href="play.html"><wa-icon name="piano"></wa-icon>看樂譜<small id="q-play"></small></a>
  </nav>

  <div class="home-label">這週練了<a href="records.html" id="to-log">紀錄 ›</a></div>
  <a class="card week" href="records.html" id="week">
    <div class="hd"><span>星期一到今天</span><b id="w-total"><span class="skel"><i></i></span></b></div>
    <div class="w-split" id="w-split" hidden></div>
    <div id="w-bars"></div>
  </a>

  
</main>

</body>
