<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4dd">
<title>Piano Page Turner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ppt.theme')||'cotton'}catch(e){document.documentElement.dataset.theme='cotton'}</script>
<style>.top{align-items:center;gap:10px;padding-top:6px;display:flex}.top .date{color:var(--muted);letter-spacing:.04em;flex:1;font-size:15px}h1.app{letter-spacing:.02em;margin:6px 0 0;font-size:30px;font-weight:600}.greet{margin:12px 0 0;font-size:19px}.cheer{color:var(--muted);min-height:1.6em;margin:2px 0 0;font-size:14px}.modes{grid-template-columns:repeat(3,1fr);gap:12px;display:grid}.mode{background:var(--surface);border:1px solid var(--line);color:var(--ink);-webkit-backdrop-filter:blur(8px);border-radius:18px;flex-direction:column;gap:4px;min-height:132px;padding:18px 18px 16px;display:flex}.mode:active{background:var(--accent-soft)}.mode wa-icon{color:var(--accent);margin-bottom:8px;font-size:24px}.mode .t{font-size:18px;font-weight:600}.mode .d{color:var(--muted);font-size:13px;line-height:1.55}@media (width<=560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px}.mode wa-icon{flex:none;margin:0}}.score{font-variant-numeric:tabular-nums;font-size:20px}.score small{color:var(--muted);font-size:12px;display:block}.themes{grid-template-columns:repeat(3,1fr);gap:12px;display:grid}.theme{border:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;color:var(--ink);border-radius:14px;flex-direction:column;gap:10px;padding:12px;display:flex}.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}.theme .sw{border:1px solid #00000010;border-radius:9px;height:48px;position:relative;overflow:hidden}.theme .sw i{border:2px solid #fff;border-radius:50%;width:14px;height:14px;position:absolute;bottom:8px}.theme .n{font-size:15px}footer{color:var(--muted);margin-top:36px;font-size:13px;line-height:1.7}</style>
  <script type="module" crossorigin src="./assets/index-D00eWJ9_.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-CAwuZLFW.js">
  <link rel="stylesheet" crossorigin href="./assets/common-DcbqM8nR.css">
</head>
<body>
<main class="page">
  <div class="top">
    <span class="date" id="date"></span>
    <button class="pill" id="midi-pill"><span class="dot"></span>連接 MIDI</button>
  </div>
  <h1 class="app">Piano Page Turner</h1>
  <p class="greet" id="greet">今天也來練一下琴～</p>
  <p class="cheer" id="cheer"></p>
  <div id="install" class="card pad row" style="margin-top:18px" hidden>
    <div class="grow"><b style="font-weight:500">安裝成 App</b><div class="muted" style="font-size:14px">像 App 一樣全螢幕打開，沒有網址列，沒網路也能用</div></div>
    <wa-button variant="brand" id="install-btn">安裝</wa-button>
  </div>

  <div class="label">模式</div>
  <nav class="modes">
    <a class="mode" href="practice.html"><wa-icon name="music"></wa-icon><div><div class="t">練習</div><div class="d">彈課本練習題，判斷音高和節奏</div></div></a>
    <a class="mode" href="play.html"><wa-icon name="book-open"></wa-icon><div><div class="t">彈奏</div><div class="d">看 PDF 樂譜，踏板翻頁</div></div></a>
    <a class="mode" href="midi-test.html"><wa-icon name="keyboard-music"></wa-icon><div><div class="t">MIDI 測試</div><div class="d">確認琴和踏板有連上</div></div></a>
  </nav>

  <div id="recent-wrap" hidden>
    <div class="label">最近練習</div>
    <div class="card list" id="recent"></div>
  </div>
  <div id="pdf-wrap" hidden>
    <div class="label">最近看的樂譜</div>
    <div class="card list" id="pdfs"></div>
  </div>

  <div class="label">外觀</div>
  <div class="themes" id="themes"></div>

  <footer>樂譜和練習紀錄只存在這台平板的瀏覽器裡，不會上傳到任何地方。</footer>
</main>

</body>
</html>
