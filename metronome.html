<script>(function(d){var t='ivory',m='light';try{t=localStorage.getItem('ppt.theme')||t;m=localStorage.getItem('ppt.mode')||m}catch(e){}if(t==='night'){t='ivory';m='dark'}var L={ivory:'#EFEDE8',stage:'#F2F3F7',teal:'#F1F4F3',coral:'#F6F3EF'},D={ivory:'#0E0E0E',stage:'#0B1020',teal:'#0B1615',coral:'#141010'};if(!L[t])t='ivory';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(m!=='dark')m='light';d.dataset.theme=t;d.dataset.mode=m;d.classList.add('booting');try{if(sessionStorage.getItem('ppt.nav')){sessionStorage.removeItem('ppt.nav');d.classList.add('nav')}}catch(e){}setTimeout(function(){d.classList.remove('booting')},4000);if(m==='dark')d.classList.add('wa-dark');var e=document.querySelector('meta[name=theme-color]');if(e)e.content=(m==='dark'?D:L)[t]})(document.documentElement)</script>
<style>html{background:#efede8}html[data-mode=dark]{background:#0e0e0e}html.booting body{visibility:hidden}html.booting:before{content:"載入中";letter-spacing:.2em;color:#8a8c90;place-items:center;padding-top:72px;font:14px sans-serif;animation:.2s .3s both boot;display:grid;position:fixed;inset:0}html.booting:after{content:"";box-sizing:border-box;border:2px solid #8a8c9033;border-top-color:#8a8c90;border-radius:50%;width:26px;height:26px;margin:-24px 0 0 -13px;animation:.2s .3s both boot,.8s linear infinite spin;position:fixed;top:50%;left:50%}html.nav.booting:before,html.nav.booting:after{animation-delay:0s}@keyframes boot{0%{opacity:0}to{opacity:1}}@keyframes spin{to{rotate:360deg}}</style>
<style>.page-head h1{font-size:28px}.sec{padding:var(--sp-lg);gap:var(--sp-md);flex-direction:column;display:flex}.tempo{justify-content:center;align-items:center;gap:var(--sp-md);display:flex}.tempo .num{font-variant-numeric:tabular-nums;text-align:center;min-width:2.2em;font-size:72px;font-weight:600;line-height:1}.tempo .num small{color:var(--muted);margin-top:var(--sp-sm);font-size:14px;font-weight:400;display:block}.tempo wa-button::part(base){border-radius:50%;width:52px;height:52px;font-size:22px}#bpm-slider{width:100%}.dots{justify-content:center;gap:var(--sp-md);min-height:22px;display:flex}.dots i{border:2px solid var(--line);border-radius:50%;width:18px;height:18px;transition:background 50ms}.dots i.on{background:var(--beat);border-color:var(--beat)}.dots i.on.first{background:var(--accent);border-color:var(--accent)}.go{justify-content:center;gap:var(--sp-ms);flex-wrap:wrap;display:flex}.go wa-button::part(base){min-width:140px}.opt{align-items:center;gap:var(--sp-ms);flex-wrap:wrap;display:flex}.opt>.k{width:4.5em;color:var(--muted);flex:none;font-size:14px}.opt wa-radio-group{flex-wrap:wrap}#volume{flex:1;min-width:160px}</style>
  <script type="module" crossorigin src="./assets/metronome-yisw1K-t.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-Dl5ogqKn.js">
  <link rel="modulepreload" crossorigin href="./assets/sound-B5FxSpfP.js">
  <link rel="modulepreload" crossorigin href="./assets/metro-DlDVz_mO.js">
  <link rel="stylesheet" crossorigin href="./assets/common-DCUILtte.css">
</head>
<body>
<main class="page">
  <nav class="site-nav" data-page="settings"></nav>
  <div class="page-head"><h1>節拍器</h1></div>
  <section class="card sec">
    <div class="tempo">
      <wa-button appearance="outlined" id="slower" aria-label="慢一點"><wa-icon name="minus"></wa-icon></wa-button>
      <div class="num"><span id="bpm-num">80</span><small id="bpm-name"></small></div>
      <wa-button appearance="outlined" id="faster" aria-label="快一點"><wa-icon name="plus"></wa-icon></wa-button>
    </div>
    <wa-slider id="bpm-slider" min="30" max="220" step="1" value="80" aria-label="速度"></wa-slider>
    <div class="dots" id="dots"></div>
    <div class="go">
      <wa-button appearance="outlined" id="tap"><wa-icon slot="start" name="audio-lines"></wa-icon>點拍子測速度</wa-button>
      <wa-button variant="brand" id="go"><wa-icon slot="start" name="play"></wa-icon>開始</wa-button>
    </div>
  </section>
  <section class="card sec" style="margin-top:var(--sp-md)">
    <div class="opt"><span class="k">拍號</span><wa-radio-group id="meter" orientation="horizontal" size="small" value="4"><wa-radio appearance="button" value="2">2/4</wa-radio><wa-radio appearance="button" value="3">3/4</wa-radio><wa-radio appearance="button" value="4">4/4</wa-radio><wa-radio appearance="button" value="6">6/8</wa-radio><wa-radio appearance="button" value="1">不分</wa-radio></wa-radio-group></div>
    <div class="opt"><span class="k">細分</span><wa-radio-group id="subdiv" orientation="horizontal" size="small" value="1"><wa-radio appearance="button" value="1">不細分</wa-radio><wa-radio appearance="button" value="2">八分</wa-radio><wa-radio appearance="button" value="3">三連音</wa-radio><wa-radio appearance="button" value="4">十六分</wa-radio></wa-radio-group></div>
    <div class="opt"><span class="k">音色</span><wa-radio-group id="sound" orientation="horizontal" size="small"></wa-radio-group></div>
    <div class="opt"><span class="k">音量</span><wa-slider id="volume" min="0.1" max="1" step="0.05" aria-label="音量"></wa-slider></div>
    <p class="muted small" style="margin:0">音色和音量跟練習曲、基本功的節拍器是同一個設定。空白鍵也可以開始 / 停止；開著的時候螢幕不會關。</p>
  </section>
</main>
</body>
</html>
