<style>html{background:#f6f6f4}html[data-mode=dark]{background:#1b1c1e}html.booting body{visibility:hidden}html.booting:before{content:"載入中";letter-spacing:.2em;color:#8a8c90;place-items:center;padding-top:72px;font:14px sans-serif;animation:.2s .3s both boot;display:grid;position:fixed;inset:0}html.booting:after{content:"";box-sizing:border-box;border:2px solid #8a8c9033;border-top-color:#8a8c90;border-radius:50%;width:26px;height:26px;margin:-24px 0 0 -13px;animation:.2s .3s both boot,.8s linear infinite spin;position:fixed;top:50%;left:50%}@keyframes boot{0%{opacity:0}to{opacity:1}}@keyframes spin{to{rotate:360deg}}</style>
<style>h1{letter-spacing:.02em;margin:4px 0 2px;font-size:28px;font-weight:600}.sub{color:var(--muted);font-size:14px}.acts{flex-wrap:wrap;gap:10px;margin:16px 0 22px;display:flex}.tiles{grid-template-columns:repeat(4,1fr);gap:12px;display:grid}@media (width<=600px){.tiles{grid-template-columns:1fr 1fr}}.tile{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:12px 16px;font-size:13px}.tile b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;line-height:1.35;display:block}.tile b small{margin:0 2px;font-size:13px;font-weight:500}.tile .up{color:var(--c-ok)}.tile .down{color:var(--c-bad)}.box{margin-top:14px;padding:18px 20px}.box-head{flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px;display:flex}.box-head h2{white-space:nowrap;flex:1;margin:0;font-size:16px;font-weight:600}#chart-wrap{min-height:60px}.heat{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;display:grid}.heat button{height:44px;font:inherit;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;border:2px solid #0000;border-radius:9px;flex-direction:column;justify-content:center;align-items:center;padding:0;font-size:13px;line-height:1.15;display:flex}.heat button small{color:var(--muted);font-size:10px}.heat .lv-ok{background:#e1eee4}.heat .lv-mid{background:#f4e9cb}.heat .lv-bad{background:#f3d9d4}.heat .lv-none{background:var(--sunken);color:var(--faint)}[data-mode=dark] .heat .lv-ok,[data-mode=dark] .heat-foot .lv-ok{background:#2f4a37}[data-mode=dark] .heat .lv-mid,[data-mode=dark] .heat-foot .lv-mid{background:#4d4224}[data-mode=dark] .heat .lv-bad,[data-mode=dark] .heat-foot .lv-bad{background:#553733}.heat button.sel{border-color:var(--accent)}.heat-foot{color:var(--muted);flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px;font-size:13px;display:flex}.heat-foot i{vertical-align:-1px;border-radius:3px;width:12px;height:12px;margin-right:5px;display:inline-block}.heat-foot .grow{flex:1}.heat-foot .lv-ok{background:#e1eee4}.heat-foot .lv-mid{background:#f4e9cb}.heat-foot .lv-bad{background:#f3d9d4}.ses{grid-template-columns:7.5em minmax(9em,1fr) 1.4fr 3.4em;align-items:center;gap:14px;padding:11px 0;font-size:14px;display:grid}.ses .w{color:var(--ink);font-size:13px}.ses .w .good{color:var(--c-ok)}.ses+.ses{border-top:1px solid var(--line)}.ses .m{color:var(--muted)}.ses .pct{text-align:right;font-variant-numeric:tabular-nums;font-size:16px}@media (width<=600px){.ses{grid-template-columns:1fr 3.4em;gap:2px 12px}.ses .m,.ses .w{grid-column:1/-1}}</style>
  <script type="module" crossorigin src="./assets/piece-DrDQ-_Xu.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-DIHS50Jv.js">
  <link rel="modulepreload" crossorigin href="./assets/stats-Db0Dhrk0.js">
  <link rel="modulepreload" crossorigin href="./assets/charts-Dzllvh6Q.js">
  <link rel="stylesheet" crossorigin href="./assets/common-Cy6v-uNw.css">
</head>
<body>
<main class="page">
  <nav class="site-nav" data-page="practice"></nav>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="acts">
    <wa-button variant="brand" id="go-all"><wa-icon slot="start" name="play"></wa-icon>練習整首</wa-button>
    <wa-button appearance="outlined" id="go-rhythm"><wa-icon slot="start" name="timer"></wa-icon>用節奏模式練</wa-button>
  </div>

  <div class="tiles" id="tiles"></div>

  <section class="card box" id="chart-box">
    <div class="box-head">
      <h2>正確率變化</h2>
      <wa-radio-group id="hand-filter" orientation="horizontal" size="small" value="all">
        <wa-radio appearance="button" value="all">全部</wa-radio>
        <wa-radio appearance="button" value="rh">右手</wa-radio>
        <wa-radio appearance="button" value="lh">左手</wa-radio>
        <wa-radio appearance="button" value="both">雙手</wa-radio>
      </wa-radio-group>
    </div>
    <div id="chart-wrap"></div>
  </section>

  <section class="card box" id="heat-box">
    <div class="box-head"><h2>每個小節</h2><span class="sub">最近 5 次的平均 ・ 點兩個小節選範圍</span></div>
    <div class="heat" id="heat"></div>
    <div class="heat-foot">
      <span><i class="lv-ok"></i>90% 以上</span><span><i class="lv-mid"></i>75–89%</span><span><i class="lv-bad"></i>75% 以下</span>
      <span class="grow"></span>
      <wa-button size="small" variant="brand" id="go-range"><wa-icon slot="start" name="play"></wa-icon><span id="range-text">練這幾小節</span></wa-button>
    </div>
  </section>

  <section class="card box">
    <div class="box-head"><h2>最近紀錄</h2></div>
    <div id="sessions"></div>
  </section>
</main>
</body>
</html>
