<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4dd">
<title>彈奏模式 · Piano Page Turner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ppt.theme')||'cotton'}catch(e){document.documentElement.dataset.theme='cotton'}</script>
<style>#viewer{background:linear-gradient(180deg, var(--bg-top), var(--bg-end));position:fixed;inset:0;overflow:hidden}#stage{justify-content:center;align-items:center;display:flex;position:absolute;inset:0}#stage canvas{background:var(--paper);display:block;box-shadow:0 2px 10px #0000001a,0 0 0 1px #00000010}#tap-zones{grid-template-columns:1fr 1fr 1fr;display:grid;position:absolute;inset:0}.flash{pointer-events:none;opacity:0;width:33.33%;transition:opacity .3s;position:absolute;top:0;bottom:0}.flash.l{background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent);left:0}.flash.r{background:linear-gradient(270deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent);right:0}.flash.show{opacity:1;transition:none}#viewer .topbar{transition:transform .25s,opacity .25s;position:absolute;top:0;left:0;right:0}#bottombar{padding:8px 12px max(8px, env(safe-area-inset-bottom));background:var(--surface);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:center;align-items:center;gap:14px;transition:transform .25s,opacity .25s;display:flex;position:absolute;bottom:0;left:0;right:0}#viewer.chrome-hidden .topbar{opacity:0;pointer-events:none;transform:translateY(-100%)}#viewer.chrome-hidden #bottombar{opacity:0;pointer-events:none;transform:translateY(100%)}#page-label{text-align:center;min-width:6em;font-size:16px}#badge{color:var(--muted);background:var(--surface);border:1px solid var(--line);pointer-events:none;border-radius:999px;padding:3px 12px;font-size:13px;position:absolute;bottom:14px;right:14px}#loading{color:var(--muted);place-items:center;display:grid;position:absolute;inset:0}#panel{z-index:25;background:var(--surface-solid);border-left:1px solid var(--line);flex-direction:column;width:min(380px,100%);display:flex;position:absolute;top:0;bottom:0;right:0;box-shadow:-10px 0 30px #0000000f}#panel header{padding:10px 10px 10px 20px;padding-top:max(10px, env(safe-area-inset-top));border-bottom:1px solid var(--line);align-items:center;display:flex}#panel header h3{flex:1;margin:0;font-size:18px;font-weight:500}#panel .sec{border-bottom:1px solid var(--line);flex-direction:column;gap:12px;padding:18px 20px;display:flex}#panel .sec h4{color:var(--muted);letter-spacing:.08em;margin:0;font-size:13px;font-weight:400}#panel .hint{color:var(--muted);margin:0;font-size:14px;line-height:1.7}</style>
  <script type="module" crossorigin src="./assets/play-DYhpkKmx.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-Cn4lgwry.js">
  <link rel="modulepreload" crossorigin href="./assets/stats-vh1suweH.js">
  <link rel="modulepreload" crossorigin href="./assets/activity-Be-62c7b.js">
  <link rel="stylesheet" crossorigin href="./assets/common-0goYS1Wl.css">
</head>
<body>

<!-- ============ Library ============ -->
<main id="library" class="page">
  <a class="back" href="./">‹ 首頁</a>
  <div class="page-head"><h1>彈奏模式</h1></div>
  <p class="muted" style="margin:4px 0 0">看 PDF 樂譜。接上 FP-30X 後，踩<b>左踏板</b>翻下一頁、<b>中踏板</b>翻上一頁。</p>
  <div class="row" style="margin-top:18px">
    <wa-button variant="brand" id="open-btn"><wa-icon slot="start" name="folder-open"></wa-icon>開啟 PDF 樂譜</wa-button>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </div>
  <div id="lib-msg" class="msg" style="margin-top:8px"></div>
  <div class="label">最近開啟</div>
  <div class="card list" id="recent"></div>
  <div class="label">範例樂譜（公版）</div>
  <div class="card list" id="samples"></div>
</main>

<!-- ============ Viewer ============ -->
<section id="viewer" hidden>
  <div id="stage"></div>
  <div id="loading">載入中…</div>
  <div class="flash l" id="flash-l"></div>
  <div class="flash r" id="flash-r"></div>
  <div id="tap-zones"><div data-zone="prev"></div><div data-zone="menu"></div><div data-zone="next"></div></div>
  <div id="badge"></div>

  <div class="topbar">
    <wa-button appearance="plain" size="small" id="close-btn"><wa-icon slot="start" name="chevron-left"></wa-icon>樂譜清單</wa-button>
    <div class="title" id="title"></div>
    <button class="pill" id="midi-pill"><span class="dot"></span>連接 MIDI</button>
    <wa-button appearance="plain" size="small" id="panel-btn"><wa-icon slot="start" name="settings"></wa-icon>設定</wa-button>
    <wa-button appearance="plain" size="small" id="fs-btn"><wa-icon slot="start" name="maximize"></wa-icon>全螢幕</wa-button>
  </div>
  <div id="bottombar">
    <wa-button appearance="outlined" id="prev-btn"><wa-icon slot="start" name="chevron-left"></wa-icon>上一頁</wa-button>
    <div id="page-label" class="num"></div>
    <wa-button appearance="outlined" id="next-btn">下一頁<wa-icon slot="end" name="chevron-right"></wa-icon></wa-button>
  </div>

  <aside id="panel" hidden>
    <header><h3>設定</h3><wa-button appearance="plain" variant="brand" id="panel-close">完成</wa-button></header>
    <div class="sec">
      <h4>踏板翻頁</h4>
      <wa-switch id="pedal-check">用踏板翻頁</wa-switch>
      <p class="hint">需要 KPD-70 三踏板：左邊（弱音）翻下一頁、中間（持音）翻上一頁，右邊的延音踏板照常使用。</p>
      <div class="row"><span class="grow muted" id="midi-status">MIDI：未連接</span><wa-button size="small" appearance="outlined" id="midi-btn">連接 MIDI</wa-button></div>
    </div>
    <div class="sec">
      <h4>其他翻頁方式</h4>
      <p class="hint">點畫面右邊 1/3 翻下一頁、左邊 1/3 翻上一頁，點中間顯示或收起工具列。鍵盤方向鍵和藍牙翻頁器也可以用。</p>
      <p class="hint" id="wake-status">螢幕常亮：–</p>
    </div>
  </aside>
</section>

</body>
</html>
