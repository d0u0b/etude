<body>
<!-- ============ 練習: the list ============ -->
<main class="page" id="list-view">
  <nav class="site-nav" data-page="timer"></nav>
  <div class="page-head"><h1>練習</h1>
    <wa-dropdown id="sort-menu" placement="bottom-end">
      <button slot="trigger" class="icon-btn" aria-label="排序" title="排序"><wa-icon name="arrow-up-down"></wa-icon></button>
      <wa-dropdown-item type="checkbox" value="recent">最近練習</wa-dropdown-item>
      <wa-dropdown-item type="checkbox" value="name">名稱</wa-dropdown-item>
      <wa-dropdown-item type="checkbox" value="most">練最多</wa-dropdown-item>
    </wa-dropdown>
    <button class="icon-btn" id="add-btn" aria-label="新增練習" title="新增"><wa-icon name="plus"></wa-icon></button>
  </div>
  <a class="running" id="running" hidden></a>
  <wa-input class="search" id="search" placeholder="搜尋" with-clear hidden><wa-icon slot="start" name="search"></wa-icon></wa-input>
  <section class="card mini-metro">
    <button class="bpm" id="m-bpm" aria-label="速度">60</button>
    <button class="ctl" id="m-slower" aria-label="慢一點"><wa-icon name="minus"></wa-icon></button>
    <button class="ctl play" id="m-play" aria-label="節拍器"><wa-icon name="play"></wa-icon></button>
    <button class="ctl" id="m-faster" aria-label="快一點"><wa-icon name="plus"></wa-icon></button>
    <button class="ctl" id="m-tap" aria-label="點拍子測速度" title="點拍子測速度"><wa-icon name="pointer"></wa-icon></button>
  </section>
  <div class="label">項目</div>
  <div class="card list items" id="items"><div class="skel"><i></i><i></i><i></i></div></div>
  <button class="arch-toggle" id="arch-toggle" hidden></button>
  <div class="card list items" id="archived" hidden></div>
  <p class="muted small hint" id="list-hint" hidden>長按可以補記時間，往左滑可以封存或刪除。</p>
</main>

<!-- ============ 練習: one item ============ -->
<main class="page" id="item-view" hidden>
  <div class="item-head">
    <button class="icon-btn" id="back"><wa-icon name="chevron-left"></wa-icon>返回</button>
    <h1 id="item-name"></h1>
    <button class="icon-btn" id="rename-btn" aria-label="改名稱" title="改名稱"><wa-icon name="pencil"></wa-icon></button>
  </div>
  <section class="metro">
    <div class="bpm-row">
      <button class="ctl" id="slower" aria-label="慢一點"><wa-icon name="minus"></wa-icon></button>
      <input id="bpm" type="number" inputmode="numeric" min="30" max="240" aria-label="速度">
      <button class="ctl" id="faster" aria-label="快一點"><wa-icon name="plus"></wa-icon></button>
    </div>
    <div class="bpm-unit" id="bpm-unit">♩ = BPM</div>
    <div class="dots" id="dots"></div>
    <button class="ctl play big" id="play" aria-label="節拍器"><wa-icon name="play"></wa-icon></button>
  </section>
  <section class="clock" id="clock">
    <div class="clock-time" id="clock-time">00:00</div>
    <div class="clock-label" id="clock-label"></div>
    <div class="clock-btns">
      <button class="ctl" id="countdown"><wa-icon name="hourglass"></wa-icon><span>倒數</span></button>
      <button class="ctl" id="pause" hidden><wa-icon name="pause"></wa-icon><span>暫停</span></button>
      <button class="ctl" id="stopwatch"><wa-icon name="timer"></wa-icon><span>計時</span></button>
    </div>
  </section>
  <div class="item-foot">
    <button id="notes-btn"><wa-icon name="notebook-pen"></wa-icon>筆記<small id="notes-count"></small></button>
    <button id="today-btn"><wa-icon name="chart-column"></wa-icon><span id="today">今天 0 分</span></button>
    <button id="settings-btn"><wa-icon name="settings"></wa-icon>設定</button>
  </div>
</main>

<wa-dialog id="add-dialog" label="新增練習">
  <wa-input id="add-name" label="名稱" placeholder="例如：給愛麗絲、C 大調音階"></wa-input>
  <wa-button slot="footer" appearance="plain" id="add-cancel">取消</wa-button>
  <wa-button slot="footer" variant="brand" id="add-save">新增</wa-button>
</wa-dialog>
<wa-dialog id="rename-dialog" label="改名稱">
  <wa-input id="rename-input" label="名稱"></wa-input>
  <wa-button slot="footer" appearance="plain" id="rename-cancel">取消</wa-button>
  <wa-button slot="footer" variant="brand" id="rename-save">儲存</wa-button>
</wa-dialog>
<wa-dialog id="log-dialog" label="補記時間">
  <div class="muted small" id="log-for"></div>
  <label class="field">日期<input type="date" id="log-date"></label>
  <div class="field">練了幾分鐘<div class="quick" id="log-quick"></div><input type="number" id="log-min" inputmode="numeric" min="1" max="600" placeholder="自訂分鐘"></div>
  <wa-button slot="footer" appearance="plain" id="log-cancel">取消</wa-button>
  <wa-button slot="footer" variant="brand" id="log-save">記下來</wa-button>
</wa-dialog>
<wa-dialog id="del-dialog" label="刪除">
  <p id="del-text"></p>
  <wa-button slot="footer" appearance="plain" id="del-cancel">取消</wa-button>
  <wa-button slot="footer" variant="danger" id="del-ok">刪除</wa-button>
</wa-dialog>
<wa-dialog id="cd-dialog" label="要練多久？">
  <div class="quick" id="cd-quick"></div>
  <div class="field">自訂分鐘<input type="number" id="cd-min" inputmode="numeric" min="1" max="300"></div>
  <wa-button slot="footer" appearance="plain" id="cd-cancel">取消</wa-button>
  <wa-button slot="footer" variant="brand" id="cd-start">開始倒數</wa-button>
</wa-dialog>
<wa-dialog id="notes-dialog" label="筆記">
  <textarea class="note-in" id="note-new" placeholder="例如：第 12 小節左手跨指一直卡"></textarea>
  <div class="note-add"><wa-button variant="brand" size="small" id="note-add">加入</wa-button></div>
  <div class="notes" id="notes"></div>
</wa-dialog>
<wa-dialog id="hist-dialog" label="練習紀錄">
  <div class="hist-sum" id="hist-sum"></div>
  <div id="hist-list"></div>
</wa-dialog>
<wa-dialog id="set-dialog" label="節拍器設定">
  <div class="opt"><span class="k">拍號</span><wa-radio-group id="set-meter" orientation="horizontal" size="small">
    <wa-radio appearance="button" value="2">2 拍</wa-radio><wa-radio appearance="button" value="3">3 拍</wa-radio><wa-radio appearance="button" value="4">4 拍</wa-radio><wa-radio appearance="button" value="6">6/8</wa-radio><wa-radio appearance="button" value="1">不分</wa-radio></wa-radio-group></div>
  <div class="opt"><span class="k">細分</span><wa-radio-group id="set-subdiv" orientation="horizontal" size="small">
    <wa-radio appearance="button" value="1">不用</wa-radio><wa-radio appearance="button" value="2">八分</wa-radio><wa-radio appearance="button" value="3">三連音</wa-radio></wa-radio-group></div>
  <div class="opt"><span class="k">音色</span><wa-radio-group id="set-sound" orientation="horizontal" size="small"></wa-radio-group></div>
  <div class="opt"><span class="k">音量</span><wa-slider id="set-volume" min="0" max="1" step="0.05"></wa-slider></div>
</wa-dialog>
</body>
</html>
