<body>
<main class="page">
  <nav class="site-nav" data-page="timer"></nav>
  <!-- the list -->
  <section id="list-view">
    <a class="back" href="timer.html"><wa-icon name="chevron-left"></wa-icon>練習</a>
    <div class="page-head"><h1>上課紀錄</h1><button class="icon-btn" id="add-btn" aria-label="記一堂課" title="記一堂課"><wa-icon name="plus"></wa-icon></button></div>
    <div class="card next-card" id="next-card" hidden><wa-icon name="calendar-clock"></wa-icon><div><b id="next-date"></b><div class="muted" id="next-left"></div></div></div>
    <div class="card hw-card" id="hw-card" hidden><div class="k" id="hw-k">這週的作業</div><div class="pre" id="hw-text"></div><div class="chips" id="hw-items"></div></div>
    <div class="label">上過的課</div>
    <div class="card list" id="class-list"><div class="skel"><i></i><i></i><i></i></div></div>
  </section>
  <!-- one lesson -->
  <section id="detail-view" hidden>
    <a class="back" href="#" id="d-back"><wa-icon name="chevron-left"></wa-icon>上課紀錄</a>
    <div class="page-head"><h1 id="d-title"></h1></div>
    <div class="meta" id="d-meta"></div>
    <div id="d-body"></div>
    <div class="d-acts"><wa-button appearance="outlined" id="d-del"><wa-icon slot="start" name="trash-2"></wa-icon>刪除</wa-button><wa-button variant="brand" id="d-edit"><wa-icon slot="start" name="pencil"></wa-icon>修改</wa-button></div>
  </section>
</main>

<wa-dialog id="edit-dialog" label="記一堂課">
  <div class="two">
    <label class="field">日期<input type="date" id="e-date"></label>
    <label class="field">下次上課<input type="date" id="e-next"></label>
  </div>
  <div class="field">上了多久<div class="quick" id="e-quick"></div><span class="min-box"><input type="number" id="e-min" inputmode="numeric" min="1" max="600" placeholder="自訂"><span>分鐘</span></span></div>
  <label class="field">上課內容<textarea id="e-content" placeholder="例如：G 大調音階、給愛麗絲第 1–16 小節、踏板換法"></textarea></label>
  <div class="field">作業 / 要練的<textarea id="e-homework" placeholder="例如：每天音階雙手 5 分鐘、第 9 小節慢練"></textarea><div class="chips" id="e-items"></div></div>
  <label class="field">心得<textarea id="e-notes" placeholder="自己的感想、老師提醒的話"></textarea></label>
  <wa-button slot="footer" appearance="plain" id="e-cancel">取消</wa-button>
  <wa-button slot="footer" variant="brand" id="e-save"><wa-icon slot="start" name="check"></wa-icon>儲存</wa-button>
</wa-dialog>
</body>
