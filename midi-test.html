<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4dd">
<title>MIDI 測試 · Étude</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(d){var t='cotton';try{t=localStorage.getItem('ppt.theme')||t}catch(e){}d.dataset.theme=t;if(t==='night')d.classList.add('wa-dark');var m=document.querySelector('meta[name=theme-color]');if(m&&t==='night')m.content='#2b2421'})(document.documentElement)</script>
<style>.status{white-space:pre-line;align-items:flex-start;gap:12px;padding:16px 20px;font-size:15px;line-height:1.7;display:flex}.status .dot{background:var(--faint);border-radius:50%;flex:none;width:10px;height:10px;margin-top:8px}.status.ok .dot{background:var(--c-ok)}.status.err .dot{background:var(--c-bad)}.status.wait .dot{background:var(--c-off)}.now{grid-template-columns:repeat(4,1fr);gap:12px;display:grid}@media (width<=600px){.now{grid-template-columns:repeat(2,1fr)}}.stat{padding:14px 16px}.stat .k{color:var(--muted);letter-spacing:.06em;font-size:13px}.stat .v{font-variant-numeric:tabular-nums;margin-top:2px;font-size:30px;font-weight:500}.stat .v.small{padding-top:10px;font-size:18px}.meter{background:var(--sunken);border-radius:3px;height:5px;margin-top:8px;overflow:hidden}.meter>div{background:var(--accent);width:0;height:100%;transition:width 80ms}.on-text{color:var(--accent)}.kbd-wrap{border:1px solid var(--line);background:var(--surface-solid);border-radius:6px;padding:10px;overflow-x:auto}.kbd{-webkit-user-select:none;user-select:none;min-width:860px;height:140px;position:relative}.key{border-radius:0 0 2px 2px;position:absolute;top:0}.key.w{z-index:1;background:#fffefb;border:1px solid #d9d2c8;height:100%}.key.b{z-index:2;background:#2f2a27;height:62%}.key.on.w{background:var(--accent-soft);box-shadow:inset 0 -6px 0 var(--accent)}.key.on.b{background:var(--accent)}.key .c{text-align:center;width:100%;color:var(--faint);pointer-events:none;font-size:10px;position:absolute;bottom:6px}#log{font-variant-numeric:tabular-nums;height:240px;padding:10px 18px;font-size:13px;line-height:1.8;overflow-y:auto}#log>div{white-space:nowrap;grid-template-columns:6.6em 1.2em 3em 4.2em 4.6em 2.6em 1fr;gap:0 8px;display:grid}#log .wide{text-overflow:ellipsis;grid-column:3/6;overflow:hidden}#log .time,#log .ch,#log .src{color:var(--muted)}#log .src{text-overflow:ellipsis;overflow:hidden}#log .row-on .mark,#log .row-on .name{color:var(--accent);font-weight:500}#log .row-off{color:var(--muted)}#log .row-cc .mark,#log .row-cc .wide{color:var(--c-ok)}@media (width<=480px){#log>div{grid-template-columns:6.4em 1em 2.8em 4em 1fr}#log .ch,#log .src{display:none}}</style>
  <script type="module" crossorigin src="./assets/midi-test-CYpN_Tef.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/common-zkFIcuoB.js">
  <link rel="stylesheet" crossorigin href="./assets/common-DVVQknXR.css">
</head>
<body>
<main class="page">
  <nav class="site-nav" data-page="midi"></nav>
  <div class="page-head">
    <h1>MIDI 測試</h1>
    <wa-button variant="brand" id="connect"><wa-icon slot="start" name="usb"></wa-icon>連接 MIDI</wa-button>
  </div>
  <div class="card status" id="status" style="margin-top:14px"><span class="dot"></span><div id="status-text">按「連接 MIDI」開始。接上電鋼琴後再按也可以，之後插拔會自動偵測。</div></div>

  <div class="label">現在</div>
  <div class="now">
    <div class="card stat"><div class="k">音名</div><div class="v" id="note">–</div></div>
    <div class="card stat"><div class="k">力度 0–127</div><div class="v" id="vel">–</div><div class="meter"><div id="vel-bar"></div></div></div>
    <div class="card stat"><div class="k">同時按住</div><div class="v" id="held">0</div></div>
    <div class="card stat"><div class="k">踏板</div><div class="v small" id="pedal">–</div></div>
  </div>

  <div class="label">琴鍵（沒接琴時也可以用手指點）</div>
  <div class="kbd-wrap"><div class="kbd" id="kbd"></div></div>

  <div class="label row" style="justify-content:space-between"><span>最近的 MIDI 訊息</span><wa-button size="small" appearance="plain" id="clear"><wa-icon slot="start" name="trash-2"></wa-icon>清除</wa-button></div>
  <div class="card"><div id="log"></div></div>
</main>

</body>
</html>
