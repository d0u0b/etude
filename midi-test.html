<style>.status{gap:var(--sp-ms);padding:var(--sp-md) var(--sp-lg);white-space:pre-line;align-items:flex-start;font-size:15px;line-height:1.7;display:flex}.status .dot{background:var(--faint);width:10px;height:10px;margin-top:var(--sp-sm);border-radius:50%;flex:none}.status.ok .dot{background:var(--c-ok)}.status.err .dot{background:var(--c-bad)}.status.wait .dot{background:var(--c-off)}.now{gap:var(--sp-ms);grid-template-columns:repeat(4,1fr);display:grid}@media (width<=600px){.now{grid-template-columns:repeat(2,1fr)}}.stat{padding:var(--sp-md) var(--sp-md)}.stat .k{color:var(--muted);letter-spacing:.06em;font-size:13px}.stat .v{font-variant-numeric:tabular-nums;margin-top:var(--sp-2xs);font-size:30px;font-weight:500}.stat .v.small{padding-top:var(--sp-ms);font-size:18px}.meter{background:var(--sunken);border-radius:var(--r-xs);height:5px;margin-top:var(--sp-sm);overflow:hidden}.meter>div{background:var(--accent);width:0;height:100%;transition:width 80ms}.on-text{color:var(--accent)}.kbd-wrap{border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-solid);padding:var(--sp-ms);overflow-x:auto}.kbd{-webkit-user-select:none;user-select:none;min-width:860px;height:140px;position:relative}.key{border-radius:0 0 var(--r-xs) var(--r-xs);position:absolute;top:0}.key.w{z-index:1;background:#fffefb;border:1px solid #d9d2c8;height:100%}.key.b{z-index:2;background:#2f2a27;height:62%}.key.on.w{background:var(--accent-soft);box-shadow:inset 0 -6px 0 var(--accent)}.key.on.b{background:var(--accent)}.key .c{text-align:center;width:100%;color:var(--faint);pointer-events:none;font-size:10px;position:absolute;bottom:6px}#log{padding:var(--sp-ms) var(--sp-md);font-variant-numeric:tabular-nums;height:240px;font-size:13px;line-height:1.8;overflow-y:auto}#log>div{gap:0 var(--sp-sm);white-space:nowrap;grid-template-columns:6.6em 1.2em 3em 4.2em 4.6em 2.6em 1fr;display:grid}#log .wide{text-overflow:ellipsis;grid-column:3/6;overflow:hidden}#log .time,#log .ch,#log .src{ <body>
<main class="page">
  <nav class="site-nav" data-page="midi"></nav>
  <div class="page-head">
    <h1>輸入測試</h1>
    <wa-button variant="brand" id="connect"><wa-icon slot="start" name="usb"></wa-icon>連接 MIDI</wa-button>
  </div>
  <div class="card status" id="status" style="margin-top:var(--sp-md)"><span class="dot"></span><div id="status-text">按「連接 MIDI」開始。接上電鋼琴後再按也可以，之後插拔會自動偵測。</div></div>

  <div class="label">麥克風（手機沒接琴時，用麥克風聽鋼琴的聲音）</div>
  <div class="card stat">
    <div class="mic-row"><wa-button appearance="outlined" id="mic-btn"><wa-icon slot="start" name="mic"></wa-icon>開始聽</wa-button><span class="mic-meter"><i id="mic-level"></i></span><span id="mic-heard">–</span></div>
    <p id="mic-hint">按「開始聽」後彈幾個音，看聽到的音名對不對。一次彈一個音；靠近琴、環境安靜會比較準。</p>
  </div>

  <div class="label">現在</div>
  <div class="now">
    <div class="card stat"><div class="k">音名</div><div class="v" id="note">–</div></div>
    <div class="card stat"><div class="k">力度 0–127</div><div class="v" id="vel">–</div><div class="meter"><div id="vel-bar"></div></div></div>
    <div class="card stat"><div class="k">同時按住</div><div class="v" id="held">0</div></div>
    <div class="card stat"><div class="k">踏板</div><div class="v small" id="pedal">–</div></div>
  </div>

  <div class="label">琴鍵（沒接琴時也可以用手指點）</div>
  <div class="kbd-wrap"><div class="kbd" id="kbd"></div></div>

  <div class="label row" style="justify-content:space-between"><span>最近的訊息</span><wa-button size="small" appearance="plain" id="clear"><wa-icon slot="start" name="trash-2"></wa-icon>清除</wa-button></div>
  <div class="card"><div id="log"></div></div>
</main>

</body>
</html>
